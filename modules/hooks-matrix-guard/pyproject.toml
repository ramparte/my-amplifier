[project]
name = "amplifier-module-hooks-matrix-guard"
version = "1.0.0"
description = "Warn when the active routing matrix cannot serve the session's actual providers"
requires-python = ">=3.11"
dependencies = ["pyyaml"]

[project.entry-points."amplifier.modules"]
hooks-matrix-guard = "amplifier_module_hooks_matrix_guard:mount"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["amplifier_module_hooks_matrix_guard"]
